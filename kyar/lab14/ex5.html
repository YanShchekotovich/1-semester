<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./css/style5.css">
    <title>Задание 5</title>
</head>
<body>
    <svg  id="svg" width="1000" height="500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"> 
    <defs>
        <linearGradient id="Gradient"> 
            <stop stop-color="green" offset="0%"/>
            <stop stop-color="orange" offset="100%"/>
        </linearGradient>
    </defs>
        <circle cy="70" cx="50" r="50" fill="blue"></circle> 

        <rect x="120" y="10" width="100" height="100" fill="red" ></rect>
        <rect x="120" y="10" width="100" height="100" transform="rotate(-90 -90 -90 -90)" fill="none" stroke-dashoffset="400" stroke-dasharray="400" stroke="dodgerblue" stroke-width="4" > 
        <animate attributeName="stroke-dashoffset" dur="3s" begin="svg.click" values="400;0" />
        </rect>

        <ellipse id="ellip" cx="380" cy="70" rx="100" ry="50" fill="green"></ellipse>
        <animate xlink:href="#ellip" attributeName="fill" from="green" to="yellow" dur="1s" begin="click" fill="freeze" />
        
        <polygon points="500 110, 700 110, 600 20" fill="url(#Gradient)" stroke="red"></polygon>
        <polyline points="10 140, 300 140, 230 180, 800, 180"></polyline> 
    </svg> 
</body>
</html>
