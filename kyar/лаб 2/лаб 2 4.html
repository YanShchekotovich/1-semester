<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Название</title>
        <style type="text/css">
         h1+p {background:yellow;}
         h2~p {color: blue;}
        </style>
    </head>
    <body>
     <h1>Заголовок 1</h1>
     <p>Абзац 1 1</p>
     <p>Абзац 1 2</p>
     <h2>Заголовок 2</h2>
     <p>Абзац 2 1</p>
     <p>Абзац 2 2</p>
    </body>
</html>
